<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modern Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:linear-gradient(135deg,#74ebd5,#ACB6E5);
}

.calculator{
    width:360px;
    background:white;
    padding:20px;
    border-radius:30px;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

#display{
    width:100%;
    height:90px;
    border:none;
    outline:none;
    background:#f5f7fa;
    border-radius:20px;
    text-align:right;
    padding:20px;
    font-size:38px;
    color:#333;
    margin-bottom:20px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:70px;
    border:none;
    border-radius:18px;
    font-size:24px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px);
}

.num{
    background:#eef2ff;
    color:#333;
}

.op{
    background:#6c63ff;
    color:white;
}

.top{
    background:#ff7675;
    color:white;
}

.equal{
    background:#00c853;
    color:white;
}

.zero{
    grid-column:span 2;
}
</style>
</head>
<body>

<div class="calculator">

<input type="text" id="display" readonly>

<div class="buttons">

<button class="top" onclick="clearDisplay()">AC</button>
<button class="top" onclick="backspace()">⌫</button>
<button class="top" onclick="append('%')">%</button>
<button class="op" onclick="append('/')">÷</button>

<button class="num" onclick="append('7')">7</button>
<button class="num" onclick="append('8')">8</button>
<button class="num" onclick="append('9')">9</button>
<button class="op" onclick="append('*')">×</button>

<button class="num" onclick="append('4')">4</button>
<button class="num" onclick="append('5')">5</button>
<button class="num" onclick="append('6')">6</button>
<button class="op" onclick="append('-')">−</button>

<button class="num" onclick="append('1')">1</button>
<button class="num" onclick="append('2')">2</button>
<button class="num" onclick="append('3')">3</button>
<button class="op" onclick="append('+')">+</button>

<button class="num zero" onclick="append('0')">0</button>
<button class="num" onclick="append('.')">.</button>
<button class="equal" onclick="calculate()">=</button>

</div>

</div>

<script>
const display = document.getElementById("display");

function append(value){
    display.value += value;
}

function clearDisplay(){
    display.value = "";
}

function backspace(){
    display.value = display.value.slice(0,-1);
}

function calculate(){
    try{
        display.value = eval(display.value);
    }catch{
        display.value = "Error";
    }
}
</script>

</body>
</html>
